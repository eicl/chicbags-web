services:
  - type: web
    name: chicbags-web-staging
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chicbags-staging-db
          property: connectionString
      - key: IZIPAY_USERNAME
        sync: false
      - key: IZIPAY_PASSWORD
        sync: false
      - key: IZIPAY_PUBLIC_KEY
        sync: false
      - key: IZIPAY_HMAC_KEY
        sync: false
      # No se conoce de antemano la URL que Render le asigne a este
      # servicio de staging, así que a diferencia de "master" queda para
      # completar a mano (Settings > Environment) una vez creado.
      - key: SITE_URL
        sync: false
      - key: MIGO_WHATSAPP_INSTANCE
        sync: false
      - key: MIGO_WHATSAPP_APIKEY
        sync: false

databases:
  - name: chicbags-staging-db
    plan: free
    databaseName: chicbags_staging
    user: chicbags_staging
