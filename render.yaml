services:
  - type: web
    name: chicbags-web
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: IZIPAY_USERNAME
        sync: false
      - key: IZIPAY_PASSWORD
        sync: false
      - key: IZIPAY_PUBLIC_KEY
        sync: false
      - key: IZIPAY_HMAC_KEY
        sync: false
      - key: SITE_URL
        value: https://chicbags-web.onrender.com
      - key: MIGO_WHATSAPP_INSTANCE
        sync: false
      - key: MIGO_WHATSAPP_APIKEY
        sync: false
      - key: MIGO_API_TOKEN
        sync: false
      - key: SUNAT_ENV
        sync: false
      - key: SUNAT_RUC
        sync: false
      - key: SUNAT_RAZON_SOCIAL
        sync: false
      - key: SUNAT_NOMBRE_COMERCIAL
        sync: false
      - key: SUNAT_DIRECCION_FISCAL
        sync: false
      - key: SUNAT_UBIGEO
        sync: false
      - key: SUNAT_SERIE_BOLETA
        sync: false
      - key: SUNAT_SOL_USER
        sync: false
      - key: SUNAT_SOL_PASSWORD
        sync: false
      - key: SUNAT_CERT_P12_BASE64
        sync: false
      - key: SUNAT_CERT_PASSWORD
        sync: false
    disk:
      name: product-images
      mountPath: /opt/render/project/src/public/product-images
      sizeGB: 1
